# Qdrant Cloud suspends a free cluster after a week without use, then deletes it.
# Hitting /health three times a week makes a real Qdrant read through the Render
# API (waking Render too), so the gap never gets past 3 days. A failed ping
# fails the job and GitHub emails the repo owner.
#
# GitHub disables scheduled workflows after 60 days without repo activity.
# If that happens, re-enable it from the Actions tab.
name: Keep alive

on:
  schedule:
    - cron: "23 9 * * 1,3,5"   # Mon, Wed, Fri 09:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping the API (Render free tier can take ~50s to wake)
        run: >
          curl --fail --silent --show-error
          --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors
          https://repo-qa-agent.onrender.com/health
